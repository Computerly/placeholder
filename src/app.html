<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Rebricks Digital" />

    <meta name="msapplication-TileColor" content="#1c1c1c" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&family=Indie+Flower&family=Pixelify+Sans:wght@400..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&family=Indie+Flower&family=Pixelify+Sans:wght@400..700&display=swap"
    />
    <meta
      name="description"
      content="Rebricks Digital helps businesses launch better websites, faster. We turn strategy into high-fidelity prototypes, blending performance, design, and conversion-focused thinking."
    />
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
